# Policy for the pinned delta file.
# The archive checksum is the pin.
# Deadstrip drops the unused Security load.
# This file records the libraries that remain.

format = "macho"
cputype = ["CPU_TYPE_ARM64"]
cpusubtype = ["CPU_SUBTYPE_ARM64_ALL"]
filetype = "MH_EXECUTE"
flags = ["MH_NOUNDEFS", "MH_DYLDLINK", "MH_TWOLEVEL", "MH_PIE", "MH_HAS_TLV_DESCRIPTORS"]
MH_PIE = true
LC_LOAD_DYLINKER = "/usr/lib/dyld"
LC_RPATH = []
LC_LOAD_WEAK_DYLIB = []
LC_REEXPORT_DYLIB = []
LC_LOAD_UPWARD_DYLIB = []
LC_LOAD_DYLIB = [
  { name = "/usr/lib/libiconv.2.dylib", why = "delta calls libiconv." },
  { name = "/System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation", why = "delta calls Core Foundation." },
  { name = "/usr/lib/libz.1.dylib", why = "delta calls libz." },
  { name = "/System/Library/Frameworks/IOKit.framework/Versions/A/IOKit", why = "delta reads host IOKit." },
  { name = "/usr/lib/libSystem.B.dylib", why = "macOS has no static libc. libc, libm, and pthread are in this file." },
]
