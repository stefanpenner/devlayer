[file."bin/devlayer"]
format = "macho"
universal = "null"
cpu = ["AArch64"]
kind = "dynamic-pie"
pie = true
interp = "/usr/lib/dyld"
needed = [
  "/usr/lib/libSystem.B.dylib",
  "/usr/lib/libresolv.9.dylib",
  "/System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation",
  "/System/Library/Frameworks/Security.framework/Versions/A/Security",
]
