# Devlayer pack policy.
# bininfo --policy reads this file.
# allow and prefix are membership.
# Each entry has a name and a why.
# The why says why that name is required.
# A bare string or array is the exact fact.
# empty means the list is empty.
# The keys are the bininfo field names.

[elf.needed]
allow = [
  { name = "libc.so.6", why = "The C library. A dynamic Linux file names it." },
  { name = "libm.so.6", why = "Math functions. A Linux file that calls libm names this soname." },
  { name = "libdl.so.2", why = "dlopen. glibc keeps this soname after the merge into libc." },
  { name = "librt.so.1", why = "Clocks and timers. glibc keeps this soname after the merge into libc." },
  { name = "libpthread.so.0", why = "Threads. glibc keeps this soname after the merge into libc." },
  { name = "libresolv.so.2", why = "DNS lookup. Go names this soname for the system resolver." },
  { name = "libgcc_s.so.1", why = "GCC unwind helpers. A gnu or C++ file may name this soname." },
  { name = "ld-linux-aarch64.so.1", why = "The AArch64 glibc loader. A file may record this soname." },
  { name = "ld-linux-x86-64.so.2", why = "The x86-64 glibc loader. A file may record this soname." },
  { name = "ld-linux.so.2", why = "The 32-bit x86 glibc loader. A file may record this soname." },
]

[elf.interp]
allow = [
  { name = "ld-linux-aarch64.so.1", why = "The AArch64 glibc loader. PT_INTERP uses the file name." },
  { name = "ld-linux-x86-64.so.2", why = "The x86-64 glibc loader. PT_INTERP uses the file name." },
  { name = "ld-linux.so.2", why = "The 32-bit x86 glibc loader. PT_INTERP uses the file name." },
]

[elf.runpath]
empty = true

[elf.rpath]
empty = true

[macho.needed]
allow = [
  { name = "/usr/lib/libSystem.B.dylib", why = "macOS has no static libc. libc, libm, and pthread are in this file." },
  { name = "/usr/lib/libobjc.A.dylib", why = "nvim, htop, btop, and eza call the Objective-C runtime." },
  { name = "/usr/lib/libc++.1.dylib", why = "The Darwin link keeps -lc++. This file is the LLVM C++ library." },
  { name = "/usr/lib/libc++abi.dylib", why = "The Darwin link keeps -lc++abi. This file is the LLVM C++ ABI." },
  { name = "/usr/lib/libutil.dylib", why = "The Darwin link maps -lutil to this SDK stub." },
  { name = "/usr/lib/libresolv.9.dylib", why = "The Go CLI records this name. The host Go toolchain adds it." },
]
prefix = [
  { name = "/System/Library/Frameworks/", why = "Compiled tools call Apple frameworks in this directory." },
]

[macho.interp]
allow = [
  { name = "/usr/lib/dyld", why = "Every dynamic Mach-O names this loader." },
]

[macho.rpath]
empty = true

[pe.needed]
allow = [
  { name = "kernel32.dll", why = "Base Windows functions for files, processes, and memory." },
  { name = "kernelbase.dll", why = "Lower-level Windows base functions. kernel32 forwards work here." },
  { name = "ntdll.dll", why = "Native Windows system calls." },
  { name = "user32.dll", why = "Windows and message functions." },
  { name = "gdi32.dll", why = "Windows graphics functions." },
  { name = "advapi32.dll", why = "Registry, services, and security functions." },
  { name = "shell32.dll", why = "Windows shell functions." },
  { name = "shlwapi.dll", why = "Windows path and string helpers." },
  { name = "ole32.dll", why = "COM object functions." },
  { name = "oleaut32.dll", why = "OLE automation functions." },
  { name = "combase.dll", why = "The COM runtime on current Windows." },
  { name = "comdlg32.dll", why = "Windows common dialogs." },
  { name = "ws2_32.dll", why = "Windows sockets." },
  { name = "mswsock.dll", why = "Extra Windows socket functions." },
  { name = "bcrypt.dll", why = "Windows cryptography functions." },
  { name = "crypt32.dll", why = "Windows certificate functions." },
  { name = "secur32.dll", why = "Windows authentication functions." },
  { name = "sechost.dll", why = "The Windows service control host." },
  { name = "rpcrt4.dll", why = "Windows RPC functions." },
  { name = "iphlpapi.dll", why = "Windows IP helper functions." },
  { name = "dnsapi.dll", why = "Windows DNS functions." },
  { name = "userenv.dll", why = "Windows user profile functions." },
  { name = "version.dll", why = "Windows file version info." },
  { name = "imm32.dll", why = "Windows input method functions." },
  { name = "setupapi.dll", why = "Windows device setup functions." },
  { name = "netapi32.dll", why = "Windows network management functions." },
  { name = "msvcrt.dll", why = "The old Windows C runtime." },
  { name = "ucrtbase.dll", why = "The Universal C runtime." },
  { name = "vcruntime140.dll", why = "The Microsoft C runtime support library." },
]
prefix = [
  { name = "api-ms-win-", why = "A Windows API set name. The loader forwards it to a system DLL." },
  { name = "ext-ms-win-", why = "A Windows extension API set. The loader forwards it to a system DLL." },
]

[pe.delay]
