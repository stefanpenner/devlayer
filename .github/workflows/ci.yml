name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded PR runs; never cancel a master publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Hermetic Go tests run once. The cli job cross-compiles the binaries.
  # Target OS runners smoke those binaries. They do not repeat the test suite.
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Bazel caches
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh configure

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~/.cache/bazel is not the Bazel 9 output root on macOS or Windows.
          # Paths are set in bazel-ci-cache.sh (repository, disk, bazelisk).
          path: |
            ~/.cache/devlayer/bazel-repository
            ~/.cache/devlayer/bazel-disk
            ~/.cache/devlayer/bazelisk
          key: bazel-linux-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-linux-

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.83.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: bazel build //:devlayer

      # Scope tests to the Go code. `bazel test //...` would also force-build
      # every //third_party source tool (htop, btop, zsh, …).
      - name: Run tests
        run: bazel test //cmd/... //internal/... //tools/...

      - name: Smoke host CLI
        run: |
          ./bazel-bin/devlayer_/devlayer version
          ./bazel-bin/devlayer_/devlayer versions

      - name: Shut down Bazel
        run: bazel shutdown || true

      - name: Cap Bazel disk cache
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh prune


  # Build devlayer CLI binaries for all platforms (cross-compiled via Bazel)
  cli:
    strategy:
      matrix:
        include:
          - config: go-linux-amd64
            name: linux-x86_64
            binary: devlayer
          - config: go-linux-arm64
            name: linux-aarch64
            binary: devlayer
          - config: go-darwin-arm64
            name: darwin-arm64
            binary: devlayer
          - config: go-windows-amd64
            name: windows-x86_64
            binary: devlayer.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Bazel caches
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh configure

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~/.cache/bazel is not the Bazel 9 output root on macOS or Windows.
          # Paths are set in bazel-ci-cache.sh (repository, disk, bazelisk).
          path: |
            ~/.cache/devlayer/bazel-repository
            ~/.cache/devlayer/bazel-disk
            ~/.cache/devlayer/bazelisk
          key: bazel-cli-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-cli-${{ matrix.name }}-

      - name: Build devlayer CLI
        run: bazel build //:devlayer --config=${{ matrix.config }}

      - name: Prepare artifact
        run: cp bazel-bin/devlayer_/${{ matrix.binary }} devlayer-${{ matrix.name }}${{ matrix.binary == 'devlayer.exe' && '.exe' || '' }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.name }}
          path: devlayer-${{ matrix.name }}${{ matrix.binary == 'devlayer.exe' && '.exe' || '' }}

      - name: Shut down Bazel
        run: bazel shutdown || true

      - name: Cap Bazel disk cache
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh prune

  # Linux C tools cross-compile on ubuntu-latest.
  # Zig in Alpine emits x86_64 and aarch64 from the runner CPU.
  # This job executes the x86_64 bundle. smoke-linux-aarch64 executes aarch64.
  linux:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Bazel caches
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh configure

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~/.cache/bazel is not the Bazel 9 output root on macOS or Windows.
          # Paths are set in bazel-ci-cache.sh (repository, disk, bazelisk).
          path: |
            ~/.cache/devlayer/bazel-repository
            ~/.cache/devlayer/bazel-disk
            ~/.cache/devlayer/bazelisk
          key: bazel-linux-bundle-${{ matrix.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-linux-bundle-${{ matrix.arch }}-

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-${{ matrix.arch }}

      # The runner is x86_64. The aarch64 CLI is for the archive only.
      - name: Download x86_64 CLI
        if: matrix.arch == 'aarch64'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-x86_64

      - name: Smoke x86_64 CLI
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x devlayer-linux-${{ matrix.arch }}
          ./devlayer-linux-${{ matrix.arch }} version
          ./devlayer-linux-${{ matrix.arch }} versions

      - name: Check aarch64 CLI machine
        if: matrix.arch == 'aarch64'
        run: |
          file devlayer-linux-aarch64 | grep -q 'ARM aarch64'

      - name: Build Linux bundle
        run: |
          # devlayer build runs the Bazel bundle, then stamps the nvim config
          # and the lua plugin pack into that archive.
          # The x86_64 CLI cross-builds both arches. The runner cannot execute aarch64.
          chmod +x devlayer-linux-x86_64
          ./devlayer-linux-x86_64 build --os linux --arch ${{ matrix.arch }}
          chmod u+w devlayer-linux-${{ matrix.arch }}.tar.gz
          # Inject devlayer CLI into the bundle
          tmpdir=$(mktemp -d)
          tar xzf devlayer-linux-${{ matrix.arch }}.tar.gz -C "$tmpdir"
          chmod +x devlayer-linux-${{ matrix.arch }}
          cp devlayer-linux-${{ matrix.arch }} "$tmpdir/bin/devlayer"
          tar czf devlayer-linux-${{ matrix.arch }}.tar.gz -C "$tmpdir" .
          rm -rf "$tmpdir"
          ls -lh devlayer-linux-${{ matrix.arch }}.tar.gz

      - name: Verify bundle
        run: |
          mkdir -p /tmp/devlayer-verify
          tar xzf devlayer-linux-${{ matrix.arch }}.tar.gz -C /tmp/devlayer-verify

          echo "==> Verifying wrappers..."
          for f in git zsh nvim go gofmt zig cc c++; do
            head -1 "/tmp/devlayer-verify/bin/$f" | grep -q '#!/bin/sh' || { echo "FAIL: bin/$f not a wrapper"; exit 1; }
            echo "  bin/$f: wrapper ok"
          done

          echo "==> Verifying nvim config..."
          test -f /tmp/devlayer-verify/share/devlayer/config/nvim/init.lua || { echo "FAIL: nvim init.lua missing"; exit 1; }
          test -d /tmp/devlayer-verify/share/devlayer/data/nvim/site/pack/core/opt/snacks.nvim || { echo "FAIL: nvim plugin pack missing"; exit 1; }
          grep -q 'XDG_CONFIG_HOME' /tmp/devlayer-verify/bin/nvim || { echo "FAIL: nvim wrapper missing XDG_CONFIG_HOME"; exit 1; }
          test ! -e /tmp/devlayer-verify/share/devlayer/data/nvim/mason || { echo "FAIL: host mason is in the bundle"; exit 1; }

          echo "==> Verifying ELF machine..."
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            want='x86-64'
          else
            want='ARM aarch64'
          fi
          for f in git/bin/git zsh/bin/zsh bin/htop bin/btop nvim/bin/nvim bin/make; do
            desc=$(file "/tmp/devlayer-verify/$f")
            echo "$desc" | grep -q "$want" || { echo "FAIL: $f is not $want"; echo "$desc"; exit 1; }
            # ET_EXEC prints "statically linked". Static PIE prints "static-pie linked".
            # Both omit PT_INTERP. A dynamic ELF matches neither phrase.
            echo "$desc" | grep -Eq 'statically linked|static-pie linked' || { echo "FAIL: $f is not a static ELF"; echo "$desc"; exit 1; }
            echo "  $f: $desc"
          done

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "==> Verifying tools execute..."
            /tmp/devlayer-verify/bin/go version
            /tmp/devlayer-verify/bin/nvim --version | head -1
            /tmp/devlayer-verify/bin/htop --version | head -1
            /tmp/devlayer-verify/bin/btop --version | head -1
            /tmp/devlayer-verify/bin/zig version
            /tmp/devlayer-verify/bin/make --version | head -1
          fi

          echo "==> All checks passed."

      - name: Smoke tools in a pinned container
        run: bazel test //linux:smoke_${{ matrix.arch }} --test_output=errors

      - name: Generate checksum
        run: sha256sum devlayer-linux-${{ matrix.arch }}.tar.gz > devlayer-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: |
            devlayer-linux-${{ matrix.arch }}.tar.gz
            devlayer-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Shut down Bazel
        run: bazel shutdown || true

      - name: Cap Bazel disk cache
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh prune

  # Darwin source tools need the Apple SDK (nvim, htop, btop, eza, make).
  # That compile stays on macos. This runner is also the smoke target.
  darwin:
    needs: cli
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: brew install cmake ninja autoconf automake libtool

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-darwin-${{ matrix.arch }}

      - name: Build Darwin bundle
        run: |
          chmod +x devlayer-darwin-${{ matrix.arch }}
          ./devlayer-darwin-${{ matrix.arch }} version
          ./devlayer-darwin-${{ matrix.arch }} versions
          ./devlayer-darwin-${{ matrix.arch }} build --os darwin --arch ${{ matrix.arch }}
          ls -lh devlayer-darwin-${{ matrix.arch }}.tar.gz

      - name: Verify bundle
        run: |
          mkdir -p /tmp/devlayer-verify
          tar xzf devlayer-darwin-${{ matrix.arch }}.tar.gz -C /tmp/devlayer-verify

          echo "==> Verifying wrappers..."
          for f in nvim go gofmt zig cc c++; do
            test ! -L "/tmp/devlayer-verify/bin/$f" || { echo "FAIL: bin/$f is a symlink"; exit 1; }
            head -1 "/tmp/devlayer-verify/bin/$f" | grep -q '#!/bin/sh' || { echo "FAIL: bin/$f not a wrapper"; exit 1; }
            echo "  bin/$f: wrapper ok"
          done

          echo "==> Verifying env vars..."
          grep -q 'VIMRUNTIME' /tmp/devlayer-verify/bin/nvim || { echo "FAIL: nvim missing VIMRUNTIME"; exit 1; }
          grep -q 'XDG_CONFIG_HOME' /tmp/devlayer-verify/bin/nvim || { echo "FAIL: nvim wrapper missing XDG_CONFIG_HOME"; exit 1; }
          grep -q 'GOROOT' /tmp/devlayer-verify/bin/go || { echo "FAIL: go missing GOROOT"; exit 1; }
          test -f /tmp/devlayer-verify/share/devlayer/config/nvim/init.lua || { echo "FAIL: nvim init.lua missing"; exit 1; }
          test -d /tmp/devlayer-verify/share/devlayer/data/nvim/site/pack/core/opt/snacks.nvim || { echo "FAIL: nvim plugin pack missing"; exit 1; }
          test ! -e /tmp/devlayer-verify/share/devlayer/data/nvim/mason || { echo "FAIL: host mason is in the bundle"; exit 1; }

          echo "==> Verifying source-built tools..."
          test -x /tmp/devlayer-verify/bin/htop || { echo "FAIL: htop not found"; exit 1; }
          test -x /tmp/devlayer-verify/bin/btop || { echo "FAIL: btop not found"; exit 1; }
          test -x /tmp/devlayer-verify/bin/make || { echo "FAIL: make not found"; exit 1; }
          test -x /tmp/devlayer-verify/nvim/bin/nvim || { echo "FAIL: nvim not found"; exit 1; }
          test -d /tmp/devlayer-verify/nvim/share/nvim/runtime || { echo "FAIL: nvim runtime not found"; exit 1; }
          test -d /tmp/devlayer-verify/zig || { echo "FAIL: zig not found"; exit 1; }

          echo "==> Verifying tools execute..."
          /tmp/devlayer-verify/bin/go version
          GOROOT_OUT=$(/tmp/devlayer-verify/bin/go env GOROOT)
          echo "$GOROOT_OUT" | grep -q '/tmp/devlayer-verify/go' || { echo "FAIL: GOROOT wrong"; exit 1; }
          /tmp/devlayer-verify/bin/nvim --version | head -1
          /tmp/devlayer-verify/bin/htop --version | head -1
          /tmp/devlayer-verify/bin/btop --version | head -1
          /tmp/devlayer-verify/bin/zig version
          /tmp/devlayer-verify/bin/make --version | head -1

          echo "==> All checks passed."

      - name: Generate checksum
        run: shasum -a 256 devlayer-darwin-${{ matrix.arch }}.tar.gz > devlayer-darwin-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-darwin-${{ matrix.arch }}
          path: |
            devlayer-darwin-${{ matrix.arch }}.tar.gz
            devlayer-darwin-${{ matrix.arch }}.tar.gz.sha256

  # Windows bundle is a pinned fetch. The linux CLI builds it.
  # The windows runner only smokes the result.
  windows:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-x86_64

      - name: Download Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-windows-x86_64

      - name: Build Windows bundle
        run: |
          set -euo pipefail
          sudo apt-get install -y zip
          chmod +x devlayer-linux-x86_64
          ./devlayer-linux-x86_64 build --os windows --arch x86_64
          tmp=$(mktemp -d)
          unzip -qo devlayer-windows-x86_64.zip -d "$tmp"
          if [ -e "$tmp/bin/devlayer" ]; then
            echo "FAIL: host devlayer binary is in the windows bundle"
            exit 1
          fi
          mkdir -p "$tmp/bin"
          cp devlayer-windows-x86_64.exe "$tmp/bin/devlayer.exe"
          rm -f devlayer-windows-x86_64.zip
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/devlayer-windows-x86_64.zip" .)
          rm -rf "$tmp"
          ls -lh devlayer-windows-x86_64.zip

      - name: Verify bundle
        run: |
          # Only the members asserted below. A full unzip writes every bundled
          # .exe. The Windows smoke unzips only the tools it runs.
          mkdir -p /tmp/devlayer-verify
          unzip -qo devlayer-windows-*.zip \
            'bin/git.cmd' \
            'bin/nvim.cmd' \
            'bin/go.cmd' \
            'bin/gofmt.cmd' \
            'bin/devlayer.exe' \
            'git/cmd/git.exe' \
            -d /tmp/devlayer-verify \
            || { echo "FAIL: zip corrupt or required member missing"; exit 1; }

          if [ -e /tmp/devlayer-verify/bin/devlayer ]; then
            echo "FAIL: host devlayer binary is in the windows bundle"
            exit 1
          fi
          test -f /tmp/devlayer-verify/bin/devlayer.exe || { echo "FAIL: bin/devlayer.exe not found"; exit 1; }

          echo "==> Verifying .cmd wrappers..."
          for f in git nvim go gofmt; do
            test -f "/tmp/devlayer-verify/bin/$f.cmd" || { echo "FAIL: bin/$f.cmd not found"; exit 1; }
            grep -q '@echo off' "/tmp/devlayer-verify/bin/$f.cmd" || { echo "FAIL: bin/$f.cmd missing @echo off"; exit 1; }
            echo "  bin/$f.cmd: wrapper ok"
          done

          grep -q 'GIT_EXEC_PATH' /tmp/devlayer-verify/bin/git.cmd || { echo "FAIL: git.cmd missing GIT_EXEC_PATH"; exit 1; }
          grep -q 'GOROOT' /tmp/devlayer-verify/bin/go.cmd || { echo "FAIL: go.cmd missing GOROOT"; exit 1; }
          grep -q 'VIMRUNTIME' /tmp/devlayer-verify/bin/nvim.cmd || { echo "FAIL: nvim.cmd missing VIMRUNTIME"; exit 1; }
          grep -q 'XDG_CONFIG_HOME' /tmp/devlayer-verify/bin/nvim.cmd || { echo "FAIL: nvim.cmd missing XDG_CONFIG_HOME"; exit 1; }
          unzip -l devlayer-windows-*.zip | grep -q 'share/devlayer/config/nvim/init.lua' || { echo "FAIL: nvim init.lua missing"; exit 1; }
          unzip -l devlayer-windows-*.zip | grep -q 'snacks.nvim/init.lua' || { echo "FAIL: nvim plugin pack missing"; exit 1; }
          if unzip -l devlayer-windows-*.zip | grep -q 'share/devlayer/data/nvim/mason/'; then echo "FAIL: host mason is in the bundle"; exit 1; fi

          echo "==> Verifying MinGit..."
          test -f "/tmp/devlayer-verify/git/cmd/git.exe" || { echo "FAIL: git/cmd/git.exe not found"; exit 1; }
          echo "  git/cmd/git.exe: ok"

          echo "==> All checks passed."

      - name: Generate checksum
        run: sha256sum devlayer-windows-x86_64.zip > devlayer-windows-x86_64.zip.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-windows-x86_64
          path: |
            devlayer-windows-x86_64.zip
            devlayer-windows-x86_64.zip.sha256

  # Execute the aarch64 bundle on an arm runner. The compile stays on ubuntu-latest.
  smoke-linux-aarch64:
    needs: [cli, linux]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download aarch64 CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-aarch64

      - name: Download aarch64 bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux-aarch64

      - name: Smoke CLI and tools
        run: |
          set -euo pipefail
          chmod +x devlayer-linux-aarch64
          ./devlayer-linux-aarch64 version
          ./devlayer-linux-aarch64 versions

          dest="${RUNNER_TEMP}/devlayer-smoke"
          mkdir -p "$dest"
          tar xzf devlayer-linux-aarch64.tar.gz -C "$dest"
          "$dest/bin/go" version
          "$dest/bin/nvim" --version >"${RUNNER_TEMP}/nvim.version"
          head -1 "${RUNNER_TEMP}/nvim.version"
          "$dest/bin/htop" --version >"${RUNNER_TEMP}/htop.version"
          head -1 "${RUNNER_TEMP}/htop.version"
          "$dest/bin/btop" --version >"${RUNNER_TEMP}/btop.version"
          head -1 "${RUNNER_TEMP}/btop.version"
          "$dest/bin/zig" version
          "$dest/bin/make" --version >"${RUNNER_TEMP}/make.version"
          head -1 "${RUNNER_TEMP}/make.version"

  # Execute the cross-compiled Windows CLI and two bundle tools.
  smoke-windows:
    needs: [cli, windows]
    runs-on: windows-latest
    steps:
      - name: Download Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-windows-x86_64

      - name: Download Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-windows-x86_64

      - name: Smoke CLI and tools
        shell: bash
        run: |
          set -euo pipefail
          ./devlayer-windows-x86_64.exe version
          ./devlayer-windows-x86_64.exe versions

          dest="${RUNNER_TEMP}/devlayer-smoke"
          mkdir -p "$dest"
          unzip -qo devlayer-windows-x86_64.zip \
            'bin/go.cmd' 'bin/nvim.cmd' 'go/*' 'nvim/*' \
            -d "$dest" \
            || { echo "FAIL: zip corrupt or smoke member missing"; exit 1; }
          win=$(cygpath -w "$dest")
          cmd.exe /c "call \"${win}\\bin\\go.cmd\" version"
          cmd.exe /c "call \"${win}\\bin\\nvim.cmd\" --version"

  # After master is green: tag, stamp CLIs, attach notes + assets.
  # GitHub release body is the changelog `devlayer upgrade` prints.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [cli, linux, darwin, windows, smoke-linux-aarch64, smoke-windows, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Bazel caches
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh configure

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~/.cache/bazel is not the Bazel 9 output root on macOS or Windows.
          # Paths are set in bazel-ci-cache.sh (repository, disk, bazelisk).
          path: |
            ~/.cache/devlayer/bazel-repository
            ~/.cache/devlayer/bazel-disk
            ~/.cache/devlayer/bazelisk
          key: bazel-publish-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-publish-

      - name: Next tag
        id: ver
        run: |
          git fetch --tags --force
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          TAG=$("$HOME/bin/bazel" run //tools/nexttag)
          LAST=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ "$TAG" = "$LAST" ]; then
            SKIP=true
          elif gh release view "$TAG" >/dev/null 2>&1; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "next $TAG (last $LAST) skip=$SKIP"

      - name: Download bundles
        if: steps.ver.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true

      - name: Stamp CLIs and inject
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y zip
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A local tag stamps the CLI. The release step creates the remote tag.
          # git push of this tag fails when the commit edits a workflow file.
          git tag "$TAG"

          stamp_cli() {
            local config="$1" dest="$2"
            bazel build //:devlayer --config="$config"
            local bin
            bin=$(bazel cquery --output=files //:devlayer --config="$config" | tail -1)
            cp "$bin" "$dest"
            chmod +x "$dest"
          }
          stamp_cli go-linux-amd64  devlayer-linux-x86_64
          stamp_cli go-linux-arm64  devlayer-linux-aarch64
          stamp_cli go-darwin-arm64 devlayer-darwin-arm64
          stamp_cli go-windows-amd64 devlayer-windows-x86_64.exe

          inject_tar() {
            local tar="$1" cli="$2"
            local tmp
            tmp=$(mktemp -d)
            tar xzf "$tar" -C "$tmp"
            mkdir -p "$tmp/bin"
            cp "$cli" "$tmp/bin/devlayer"
            chmod +x "$tmp/bin/devlayer"
            tar czf "$tar" -C "$tmp" .
            rm -rf "$tmp"
            sha256sum "$tar" > "$tar.sha256"
          }
          inject_tar devlayer-linux-x86_64.tar.gz  devlayer-linux-x86_64
          inject_tar devlayer-linux-aarch64.tar.gz devlayer-linux-aarch64
          inject_tar devlayer-darwin-arm64.tar.gz  devlayer-darwin-arm64

          tmp=$(mktemp -d)
          unzip -qo devlayer-windows-x86_64.zip -d "$tmp"
          mkdir -p "$tmp/bin"
          cp devlayer-windows-x86_64.exe "$tmp/bin/devlayer.exe"
          rm -f devlayer-windows-x86_64.zip
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/devlayer-windows-x86_64.zip" .)
          rm -rf "$tmp"
          sha256sum devlayer-windows-x86_64.zip > devlayer-windows-x86_64.zip.sha256

      - name: Create GitHub release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --title "${{ steps.ver.outputs.tag }}" \
            devlayer-linux-x86_64 \
            devlayer-linux-aarch64 \
            devlayer-darwin-arm64 \
            devlayer-windows-x86_64.exe \
            devlayer-linux-x86_64.tar.gz \
            devlayer-linux-x86_64.tar.gz.sha256 \
            devlayer-linux-aarch64.tar.gz \
            devlayer-linux-aarch64.tar.gz.sha256 \
            devlayer-darwin-arm64.tar.gz \
            devlayer-darwin-arm64.tar.gz.sha256 \
            devlayer-windows-x86_64.zip \
            devlayer-windows-x86_64.zip.sha256 \
            scripts/install.sh \
            scripts/install.ps1

      - name: Shut down Bazel
        run: bazel shutdown || true

      - name: Cap Bazel disk cache
        shell: bash
        run: bash .github/workflows/bazel-ci-cache.sh prune
