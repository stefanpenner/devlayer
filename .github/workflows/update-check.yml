name: Check for updates

on:
  # Clock is the NAS (Sunday 08:00), not GitHub cron.
  # GitHub disables on:schedule after 60 days; bot merges do not reset that.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# GITHUB_TOKEN PRs do not run pull_request CI (GitHub recursion guard).
# Test + URL-probe in this job, then squash-merge. No Grok on GHA.

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazel
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-update-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-update-

      - name: Install Bazelisk
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
          bazel version

      - name: Check for newer versions
        id: check
        run: |
          bazel run //tools/checkupdates -- --env versions.env
          if [ -s /tmp/updates.txt ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_FILE: /tmp/updates.txt

      - name: Test
        if: steps.check.outputs.has_updates == 'true'
        run: bazel test //cmd/... //internal/... //tools/...

      - name: Probe download URLs
        if: steps.check.outputs.has_updates == 'true'
        run: bazel run //tools/download -- --probe --versions versions.env

      - name: Merge
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/update-versions-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add versions.env
          git commit -m "$(cat <<EOF
          chore: update tool versions

          $(cat /tmp/updates.txt)
          EOF
          )"
          git push -u origin "$BRANCH"
          PR=$(gh pr create \
            --title "chore: update tool versions" \
            --body "$(cat <<EOF
          ## Updated versions

          $(cat /tmp/updates.txt)

          ---
          NAS-dispatched auto-bump. Tests + URL probe ran in [update-check](.github/workflows/update-check.yml).
          Squash-merged from this job (GITHUB_TOKEN PRs do not trigger pull_request CI).
          EOF
          )")
          gh pr merge "$PR" --squash --delete-branch
