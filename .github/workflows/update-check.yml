name: Check for updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for newer versions
        id: check
        run: |
          UPDATES_FILE=/tmp/updates.txt bash scripts/check-updates.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create PR
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/update-versions-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add versions.env
          git commit -m "$(cat <<EOF
          chore: update tool versions

          $(cat /tmp/updates.txt)
          EOF
          )"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update tool versions" \
            --body "$(cat <<EOF
          ## Updated versions

          $(cat /tmp/updates.txt)

          ---
          Auto-generated by [update-check](.github/workflows/update-check.yml)
          EOF
          )"
        env:
          GH_TOKEN: ${{ github.token }}
